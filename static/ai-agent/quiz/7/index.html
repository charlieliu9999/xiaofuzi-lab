4e39aa19c7774c8bf49583b89a6/book/chapter7.md\",\"coverage\":\"依据第七章已读部分：τ²-bench 一条任务的四个组成、评估环境五个要素、Pass@k 与 Pass^k 的计算例子，以及章末小结中的证据链。未阅读全部基准对照、统计检验公式和可观测性实现。\",\"lessons\":[{\"id\":\"task\",\"title\":\"一条任务要写清谁知道什么\",\"minutes\":13,\"summary\":\"工单、用户模拟器的知识边界、初始状态和评分标准，一起构成可重复的题目。\",\"paragraphs\":[\"书中用 τ²-bench 的电信任务说明一条评估长什么样。Agent 只看到工单，例如手机无法上网、人在法国。用户模拟器另有一份说明：知道姓名和号码，不一定知道飞行模式开着。故障原因不能靠“用户主动全说出来”。\",\"初始状态把两侧重置到同一起点。评分可以检查动作有没有发生、环境终态对不对、该告诉用户的信息有没有说。只有终态断言时，过程动作可以另列。模拟用户还必须依据工具结果说话，否则两个模型会互相确认“已经好了”。\",\"这四个部分是这一节的解剖：给 Agent 的任务、给用户模拟器的行为、初始状态、评分标准。本课不要求你克隆那个基准或运行它。\"],\"terms\":[{\"term\":\"渐进式信息透露\",\"meaning\":\"用户一开始并不掌握全部事实，Agent 必须问和查。\"},{\"term\":\"事实锚定\",\"meaning\":\"模拟用户关于设备的回答必须以工具结果为依据。\"},{\"term\":\"初始状态\",\"meaning\":\"每次运行前都能回到的同一起点。\"}],\"example\":{\"title\":\"用户只说“上不了网”\",\"body\":\"若提示词一开始就写出“请关闭飞行模式”，评估就变成了照做。把飞行模式放在用户不知道的初始状态里，Agent 才需要引导用户查看设备。\"},\"exercise\":{\"title\":\"写一道你自己的小题\",\"steps\":[\"选一个重复出现的任务，例如“测试失败后只改相关文件”。\",\"写出给 Agent 的工单，故意少写一个关键事实。\",\"写出初始状态和怎样重置。\",\"写出一个环境能自动检查的终态，例如某条测试通过。\"],\"doneWhen\":\"成功不依赖你口头说“看起来行”。\"},\"section\":\"一条评估任务的解剖\"},{\"id\":\"metrics\",\"title\":\"至少成功一次，和连续成功\",\"minutes\":12,\"summary\":\"Pass@k 看能力上限。Pass^k 看连续 k 次都通过，更接近不能出错的业务。\",\"paragraphs\":[\"单次成功率是 p。Pass@k = 1-(1-p)^k，表示 k 次里至少成功一次。Pass^k = p^k，表示连续 k 次都成功。书中也把后者叫作 Pass consecutive k。\",\"p = 0.6、k = 5 时，至少成功一次约 99%，连续五次都成功约 7.8%。前一个数字适合看探索上限，后一个才接近支付、退款和部署。Best@k 看的是多次尝试里最好的那次，和“每次都对”也不是同一个口径。\",\"工具调用型任务可以没有模拟用户，用测试检查文件或数据库。人机交互型任务还要评价引导是否合理。无论哪一种，环境都要能重置。\"],\"terms\":[{\"term\":\"Pass@k\",\"meaning\":\"k 次尝试中至少成功一次的概率口径。\"},{\"term\":\"Pass^k\",\"meaning\":\"连续 k 次都成功，且不能触发一票否决项。\"},{\"term\":\"Best@k\",\"meaning\":\"给足 k 次后，取最好的那一次来看上限。\"}],\"example\":{\"title\":\"60% 的单次成功率不够拿去退款\",\"body\":\"探索一个新功能时，五次里有一次走通就值得记下路径。真正扣款时，连续失败一次就不可接受。报告数字时要写明是哪一个 k、哪一种 Pass。\"},\"exercise\":{\"title\":\"为你的任务选一个口径\",\"steps\":[\"给任务估一个诚实的单次成功率，可以是猜测，但要写依据。\",\"计算或估算 k = 3 时的“至少一次”和“连续三次”。\",\"根据失败代价选择你将对外报告哪一个。\",\"写一条一票否决项，例如误删文件或编造订单号。\"],\"doneWhen\":\"笔记里同时有口径名称和失败代价。\"},\"section\":\"评估指标；评估环境\"},{\"id\":\"loop\",\"title\":\"分数要变成下一次实验\",\"minutes\":11,\"summary\":\"评估提供证据。失败归因决定后面的修改有没有依据。\",\"paragraphs\":[\"小结把链条收成四步：成功的定义，任务从哪来，用什么验证，分数怎样变成决策。任务可以来自公开基准、自建业务集和生产轨迹。验证可以从确定性检查走到评分细则加模型评判，再到配对比较。\",\"获得一条信息，和在当前决策里正确使用它，是两种能力。端到端回归防止老任务变差；轨迹前缀上的边界题专门检查该不该澄清、该不该在危险动作前停下。\",\"方法是观察、假设、实验、验证，再产生下一个假设。本章对应全书里的“证据”。它还不负责把修改写进提示词或参数，那是第八章和第九章。\"],\"terms\":[{\"term\":\"失败归因\",\"meaning\":\"从整条轨迹找到第一个真正的错，而不是只看最后一句。\"},{\"term\":\"回归任务\",\"meaning\":\"改完之后仍须通过的旧任务。\"},{\"term\":\"边界任务\",\"meaning\":\"专门检查不该做的事和该停下来问的情况。\"}],\"example\":{\"title\":\"修一个错误时留下旧题\",\"body\":\"助手总是过早宣布完成。你加了一条“必须跑测试”的规则后，要用原来失败的题证明它变好，并用原来已经做对的题证明没有变差。\"},\"exercise\":{\"title\":\"写一个最小回归对\",\"steps\":[\"写一个当前会失败的具体例子。\",\"写一个当前已经正确、不希望被改坏的例子。\",\"给两个例子各写一条自动或人工可重复的检查。\",\"标明它们哪一个是边界集，哪一个是保留集。\"],\"doneWhen\":\"两个例子都能在不依赖记忆的情况下重做。\"},\"section\":\"从 Benchmark 到系统改进\"}],\"questions\":[{\"id\":\"q1\",\"prompt\":\"τ²-bench 那条电信任务里，为什么不把飞行模式写进用户一开始就知道的信息？\",\"choices\":[{\"id\":\"a\",\"text\":\"为了让 Agent 练习澄清和引导查看，而不是复述完整答案\"},{\"id\":\"b\",\"text\":\"因为评分标准不能检查终态\"},{\"id\":\"c\",\"text\":\"因为初始状态不允许重置\"},{\"id\":\"d\",\"text\":\"因为工单必须包含全部根因\"}],\"correctChoiceId\":\"a\",\"explanation\":\"用户的知识范围被单独建模。真实用户往往只说“上不了网”。\"},{\"id\":\"q2\",\"prompt\":\"模拟用户若没有“依据工具结果回答”的约束，评估会怎样退化？\",\"choices\":[{\"id\":\"a\",\"text\":\"两个模型可能互相确认问题已解决\"},{\"id\":\"b\",\"text\":\"环境会无法启动\"},{\"id\":\"c\",\"text\":\"Pass^k 会自动变成 1\"},{\"id\":\"d\",\"text\":\"工具调用会被禁止\"}],\"correctChoiceId\":\"a\",\"explanation\":\"事实锚定防止模拟用户顺着 Agent 的话术承认成功。\"},{\"id\":\"q3\",\"prompt\":\"书中列出的可重复评估环境，五个要素是？\",\"choices\":[{\"id\":\"a\",\"text\":\"数据集、环境状态、工具接口、评分标准、执行协议\"},{\"id\":\"b\",\"text\":\"只需要一个总分数\"},{\"id\":\"c\",\"text\":\"预训练语料、分词器、学习率、批大小、显卡型号\"},{\"id\":\"d\",\"text\":\"系统提示词、Skill、MCP、沙盒、语音\"}],\"correctChoiceId\":\"a\",\"explanation\":\"缺一个就不能构成可重置、可比较的循环。工具调用型任务可以省去用户模拟，但其余要素还在。\"},{\"id\":\"q4\",\"prompt\":\"单次成功率 0.6、k = 5 时，书中用来说明的两个结果大约是？\",\"choices\":[{\"id\":\"a\",\"text\":\"Pass@5 约 99%，Pass^5 约 7.8%\"},{\"id\":\"b\",\"text\":\"两个数字都约 60%\"},{\"id\":\"c\",\"text\":\"Pass@5 约 7.8%，Pass^5 约 99%\"},{\"id\":\"d\",\"text\":\"两者都等于 1-(0.6)^5\"}],\"correctChoiceId\":\"a\",\"explanation\":\"至少成功一次会把中等成功率装点得很高。连续成功仍接近 p 的 k 次方。\"},{\"id\":\"q5\",\"prompt\":\"支付或退款这类动作，更应该优先报告哪一个口径？\",\"choices\":[{\"id\":\"a\",\"text\":\"Pass@k，因为它看起来更高\"},{\"id\":\"b\",\"text\":\"Pass^k，关注连续执行都不要出错\"},{\"id\":\"c\",\"text\":\"只报告一次演示的录屏\"},{\"id\":\"d\",\"text\":\"Best@k，并把最好的一次当成日常可靠性\"}],\"correctChoiceId\":\"b\",\"explanation\":\"探索任务可以看上限。不能出错的业务要看连续成功，并加上安全类的一票否决。\"},{\"id\":\"q6\",\"prompt\":\"改完 Agent 之后，边界集和保留集分别用来做什么？\",\"choices\":[{\"id\":\"a\",\"text\":\"边界集证明这次修改打中了目标问题；保留集证明原来做对的没有变差\"},{\"id\":\"b\",\"text\":\"两者都只用来提高 Pass@k 的展示值\"},{\"id\":\"c\",\"text\":\"保留集可以在修改后删除\"},{\"id\":\"d\",\"text\":\"边界集就是模型的训练集\"}],\"correctChoiceId\":\"a\",\"explanation\":\"只测会失败的题，可能把过拟合当成进步。只测旧题，可能看不出修改是否有效。\"}]}}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"14:I[622,[],\"IconMark\"]\nc:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Agent 学习伴侣\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"配合李博杰《深入理解 AI Agent》的独立中文学习系统。进度保存在本机浏览器。\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/xiaofuzi-lab/ai-agent/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\"$\",\"link\",\"3\",{\"rel\":\"icon\",\"href\":\"/xiaofuzi-lab/ai-agent/icon.svg?8af7ff86a23bc488\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L14\",\"4\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"11:\"$c:metadata\"\n"])</script></body></html>
