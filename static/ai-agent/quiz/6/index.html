9c7774c8bf49583b89a6/book/chapter6.md\",\"coverage\":\"依据第六章小结，以及引言中对本章结构的说明。讲到异步与时机、三种语音范式、Computer Use 和机器人共享的控制原语。未阅读硬件步骤、具体模型接口参数和实验代码，课文不把那些细节当成已学内容。\",\"lessons\":[{\"id\":\"async\",\"title\":\"世界也会主动找上门\",\"minutes\":12,\"summary\":\"异步改变的是时机，不是模态。动作可以先发起，结果以后用事件收回来。\",\"paragraphs\":[\"前五章默认人和 Agent 轮流说话。真实任务里，邮件、定时器和别人的系统会在 Agent 没有提问时发生变化。观察从“自己去取”扩展成“世界推过来”，动作从“这一轮必须做完”扩展成“先发起，稍后收尾”。\",\"书中的小结把这一章收成同一条控制骨架，并共享一组原语：唤醒、安全点、取消、抢占、快路径和慢路径分开。用户不一定在线，所以沟通也要能跨渠道补上。\",\"本课停在这些机制。OpenClaw 的具体事件实现、没有原生异步时的兼容写法和某个模型的异步接口，需要你到原书对应小节核对，这里不复述未读的代码。\"],\"terms\":[{\"term\":\"唤醒\",\"meaning\":\"外部事件让 Agent 开始一轮工作。\"},{\"term\":\"安全点\",\"meaning\":\"可以暂停、取消或移交而不会把动作停在危险中间态的位置。\"},{\"term\":\"抢占\",\"meaning\":\"新的更高优先级事件打断当前工作。\"}],\"example\":{\"title\":\"一封邮件不是一轮聊天\",\"body\":\"Agent 登记“新邮件到达时叫醒我”。它先起草回复，把发送标成待确认，然后可以去做别的事。人在安全点批准或取消。取消必须真的停掉还没发出的动作。\"},\"exercise\":{\"title\":\"给一个异步任务标出五个原语\",\"steps\":[\"选一个会等待外部世界的任务，例如等客户回邮件后再改订单。\",\"写出谁来唤醒、哪里是安全点、怎样取消、什么事件可以抢占。\",\"分开写快路径（告诉用户已收到）和慢路径（真正处理订单）。\",\"不要在本站连接邮箱或执行脚本。\"],\"doneWhen\":\"五个原语都能对上你的任务，而不是只写“做个异步”。\"},\"section\":\"异步与事件驱动\"},{\"id\":\"voice\",\"title\":\"语音把时间压到很短\",\"minutes\":11,\"summary\":\"从轮流说话走向边听边说。前台要快，深度思考可以放在另一条路径。\",\"paragraphs\":[\"语音这一节的主线是三种范式：级联流水线、端到端的全模态模型、全双工。演进方向是从“你说完我再说”走向持续地听和说。\",\"实时交互和深度思考可以分开。快的路径先给一个回应，慢的路径再完成需要工具和推理的回答。书中的小结把这种快慢分离看成和异步、屏幕操作、机器人共用的系统原语。\",\"本伴侣不展开声学模型和具体延迟数字。你若要做语音产品，请以原书该节和厂商当前接口为准。\"],\"terms\":[{\"term\":\"级联\",\"meaning\":\"识别、推理、合成分成若干段依次或流式衔接。\"},{\"term\":\"全双工\",\"meaning\":\"听和说可以重叠，而不是严格轮流。\"},{\"term\":\"快慢分离\",\"meaning\":\"即时回应和更慢的思考走不同路径。\"}],\"example\":{\"title\":\"先接话，再查订单\",\"body\":\"用户说“我的包裹呢”。快路径先确认正在查，慢路径再调用订单工具。慢路径不能阻塞到用户以为通话断了，查完后的结论要能插进当前对话。\"},\"exercise\":{\"title\":\"划分一句语音请求的快慢路径\",\"steps\":[\"写一句你会对助手说的话。\",\"标出 1 秒内应该听到的回应。\",\"标出必须等工具结果才能说的部分。\",\"写一条用户打断时，慢路径怎样取消。\"],\"doneWhen\":\"快路径没有假装已经完成慢路径的任务。\"},\"section\":\"语音：最自然的人机接口\"},{\"id\":\"world\",\"title\":\"屏幕和物理世界仍要靠新的观察收尾\",\"minutes\":11,\"summary\":\"Computer Use 和机器人把动作伸到界面和物体上。做完没有，必须由新观察判定。\",\"paragraphs\":[\"Computer Use 把同一条闭环搬到屏幕上。书中的小结认为，难点已经不只是能不能点完，还包括操作效率、连续的视觉理解，以及动作之后确认状态。移动端还有生态权限这层壁垒，本课不展开未读的平台细节。\",\"机器人一节把动作推进到物理环境。小结里的取舍是：动作分块要在平滑和反应速度之间选择；任务是否完成，仍然看新的观察，而不是看计划书写得完不完整。\",\"视觉定位、世界模型和从仿真到真实设备的具体做法，超出本课已核对的范围。遇到硬件或模型卡片时，回到原书，不要用本课代替。\"],\"terms\":[{\"term\":\"Computer Use\",\"meaning\":\"通过图形界面观察和操作计算机。\"},{\"term\":\"动作后确认\",\"meaning\":\"执行后读取新的界面或传感器状态，判断动作是否生效。\"},{\"term\":\"动作分块\",\"meaning\":\"一次输出一小段连续动作，而不是只发一个瞬时指令。\"}],\"example\":{\"title\":\"点击之后要再看一眼\",\"body\":\"助手点击“提交”后，不能把点击本身当成成功。它需要新的观察：页面出现确认号，或出现明确的错误。没有这第二次观察，闭环就断了。\"},\"exercise\":{\"title\":\"为一次界面操作写观察\",\"steps\":[\"选一个你每周要点的网页流程，只写步骤名称。\",\"每一步写出动作前应看见什么、动作后应看见什么。\",\"写一条状态不符时的停止条件。\",\"说明为什么不能只保存点击坐标。\"],\"doneWhen\":\"每一步都有动作后的观察，而不只是动作名称。\"},\"section\":\"Computer Use；机器人操作\"}],\"questions\":[{\"id\":\"q1\",\"prompt\":\"书中怎样概括异步相对前几章的变化？\",\"choices\":[{\"id\":\"a\",\"text\":\"模态变了，时机没有变\"},{\"id\":\"b\",\"text\":\"时机变了：世界可以主动推送观察，动作也可以稍后收尾\"},{\"id\":\"c\",\"text\":\"它取消了观察—动作闭环\"},{\"id\":\"d\",\"text\":\"它只适用于机器人，不适用于邮件\"}],\"correctChoiceId\":\"b\",\"explanation\":\"小结写的是观察从主动去取变成世界推来，动作从回合内做完变成先发起、靠事件收尾。\"},{\"id\":\"q2\",\"prompt\":\"这一章共享的控制原语包括哪些？\",\"choices\":[{\"id\":\"a\",\"text\":\"唤醒、安全点、取消、抢占、快慢分离\"},{\"id\":\"b\",\"text\":\"预训练、SFT、RL、蒸馏\"},{\"id\":\"c\",\"text\":\"稠密、稀疏、重排序、图谱\"},{\"id\":\"d\",\"text\":\"只增不改一种，没有其他原语\"}],\"correctChoiceId\":\"a\",\"explanation\":\"语音、屏幕和机器人尽管模态不同，小结把它们收成同一组系统原语。\"},{\"id\":\"q3\",\"prompt\":\"三种语音范式的演进方向是？\",\"choices\":[{\"id\":\"a\",\"text\":\"从持续听说退回严格的轮流说话\"},{\"id\":\"b\",\"text\":\"从轮流说话走向级联、全模态和全双工所能支持的持续听说\"},{\"id\":\"c\",\"text\":\"只用文字，避免任何音频\"},{\"id\":\"d\",\"text\":\"把所有思考都放进一次没有打断的独白\"}],\"correctChoiceId\":\"b\",\"explanation\":\"小结的主线是从轮流说话走向持续听说，并在实时回应和深度思考之间分工。\"},{\"id\":\"q4\",\"prompt\":\"快慢路径分离主要解决什么？\",\"choices\":[{\"id\":\"a\",\"text\":\"让深度工具调用阻塞到用户得不到任何回应\"},{\"id\":\"b\",\"text\":\"前台及时回应，后台再完成更慢的思考或工具结果\"},{\"id\":\"c\",\"text\":\"取消系统提示词\"},{\"id\":\"d\",\"text\":\"用一个路径同时保证最低延迟和最长推理\"}],\"correctChoiceId\":\"b\",\"explanation\":\"即时交互和需要时间的推理被拆开。慢路径仍要能被取消或在完成后插回。\"},{\"id\":\"q5\",\"prompt\":\"Computer Use 在“能点完”之后，小结还强调什么？\",\"choices\":[{\"id\":\"a\",\"text\":\"只优化鼠标移动速度，不看结果\"},{\"id\":\"b\",\"text\":\"操作效率、连续视觉理解，以及动作之后的状态确认\"},{\"id\":\"c\",\"text\":\"把屏幕动作写进模型后就不必再观察\"},{\"id\":\"d\",\"text\":\"用一次点击代替全部评估\"}],\"correctChoiceId\":\"b\",\"explanation\":\"动作本身不是完成。新的屏幕状态才说明提交是否生效。\"},{\"id\":\"q6\",\"prompt\":\"机器人任务最终是否完成，小结要求依据什么？\",\"choices\":[{\"id\":\"a\",\"text\":\"计划文本已经写完\"},{\"id\":\"b\",\"text\":\"新的观察\"},{\"id\":\"c\",\"text\":\"动作分块越长越好，因此不必再看\"},{\"id\":\"d\",\"text\":\"仿真里成功过一次即可当作真实成功\"}],\"correctChoiceId\":\"b\",\"explanation\":\"动作分块要在平滑和反应之间取舍，但完成与否仍由新观察判定。仿真到真实设备的细节不在本测验范围内。\"}]}}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"14:I[622,[],\"IconMark\"]\nc:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Agent 学习伴侣\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"配合李博杰《深入理解 AI Agent》的独立中文学习系统。进度保存在本机浏览器。\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/xiaofuzi-lab/ai-agent/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\"$\",\"link\",\"3\",{\"rel\":\"icon\",\"href\":\"/xiaofuzi-lab/ai-agent/icon.svg?8af7ff86a23bc488\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L14\",\"4\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"11:\"$c:metadata\"\n"])</script></body></html>
