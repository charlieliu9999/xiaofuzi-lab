/dbc046eb896ac4e39aa19c7774c8bf49583b89a6/book/chapter10.md\",\"coverage\":\"依据第十章已读的分类、信息增量判据、通信方式和章末失败模式。未阅读 Agent 社会各案例的正文，测验不考查小镇、经济或博弈案例的细节。\",\"lessons\":[{\"id\":\"axes\",\"title\":\"先问信息是否增加\",\"minutes\":12,\"summary\":\"两个设计轴是上下文是否共享，以及拓扑是对等、管理者还是去中心化。\",\"paragraphs\":[\"共享上下文让下一角色看见完整轨迹，细节不丢，但窗口膨胀，角色也容易被前一段惯性带着走。不共享时，每个 Agent 只拿移交包。包可以是工具参数、共享文件或消息总线上的消息。文件像共享内存，参数和总线像消息传递。\",\"拓扑有三种：对等角色按固定循环互相改进，管理者分派子任务，去中心化则没有运行时的中心控制者。它们都是执行图的不同形状。\",\"是否值得拆开，看协作有没有引入生成时看不到的新信息。自己再读一遍、几个模型讨论同一段文字，通常没有新信息。测试输出、渲染截图和外部工具验证则有。额外 token 必须被这个增量抵消。\"],\"terms\":[{\"term\":\"共享上下文\",\"meaning\":\"后续 Agent 接收前面的完整轨迹。\"},{\"term\":\"移交包\",\"meaning\":\"隔离的 Agent 之间显式传递的结构化信息。\"},{\"term\":\"信息增量\",\"meaning\":\"单个 Agent 在生成时得不到、必须靠外部反馈或他人证据才出现的信息。\"}],\"example\":{\"title\":\"两个模型互相称赞不算审查\",\"body\":\"起草者和另一个模型一起读同一份文稿，往往只是重复信心。让审核者运行测试或看渲染结果，才引入起草时不存在的证据。\"},\"exercise\":{\"title\":\"判断一件事要不要拆\",\"steps\":[\"选一个你想拆成两个助手的任务。\",\"写出第二个角色能看见、而第一个在生成时看不见的信息。\",\"若写不出来，就保持单 Agent。\",\"若写得出来，选择共享全轨迹还是只交一份结构化结果，并说明 token 代价。\"],\"doneWhen\":\"决定基于新信息，而不是基于“多 Agent 更先进”。\"},\"section\":\"分类框架；多 Agent 何时真正优于单 Agent\"},{\"id\":\"interfaces\",\"title\":\"协作靠接口，不靠互相看思考过程\",\"minutes\":12,\"summary\":\"把边界、权限和验收写进移交，而不是把隐藏推理当成协议。\",\"paragraphs\":[\"好的协作约定角色能做什么、产物长什么样、怎样算通过。管理者不是把任务扔出去干等，还要按难度分配步骤预算：简单子任务少几步，复杂子任务留出规划、实现和验证。只增加步数，不会自动让没有预算意识的 Agent 搜索得更深。\",\"对等循环适合提议和审核、互相迭代。辩论和头脑风暴若没有外部证据，不要期待它们超过单 Agent。跨组织时，书中把 A2A 放在互操作的位置；本课不展开协议字段。\",\"虚拟文件系统、生命周期和消息机制分别承担数据、控制与传递。你在 Cursor 或 Codex 里开多个并行尝试时，也可以用同一标准检查：它们有没有独立证据，还是只是同一想法的多次采样。\"],\"terms\":[{\"term\":\"管理者模式\",\"meaning\":\"中心角色负责任务划分、预算和汇总。\"},{\"term\":\"对等协作\",\"meaning\":\"少量角色按固定循环改进同一产物。\"},{\"term\":\"步骤预算\",\"meaning\":\"按任务难度分配可执行的步数，并要求使用方式本身可检查。\"}],\"example\":{\"title\":\"移交包而不是整段内心戏\",\"body\":\"调研角色交给写作角色的是来源、结论和未解决的问题。写作角色不需要、也不应该依赖调研角色的全部试错句子。验收是每条结论都有来源。\"},\"exercise\":{\"title\":\"写一份移交包\",\"steps\":[\"假设一个角色负责查资料，一个角色负责改代码。\",\"列出移交字段：目标、证据、允许修改的路径、怎样验证。\",\"写明第二个角色不能做的事。\",\"估计这样做比单人多消耗的步骤，并写是否值得。\"],\"doneWhen\":\"第二个角色不必看到第一个角色的思考过程也能开工。\"},\"section\":\"共享与不共享上下文；管理者与对等协作\"},{\"id\":\"failures\",\"title\":\"多个 Agent 会把错误放大\",\"minutes\":11,\"summary\":\"并发冲突、级联、同质失效、循环失控，以及人把理解一并交出去。\",\"paragraphs\":[\"小结列出的失败包括：共享资源上的并发和语义冲突，错误沿通信链放大，同质 Agent 一起错，循环过早停止或停不下来。人若不再理解产物，就会积累理解债，甚至把责任也交出去。\",\"基本的容错是工作副本或乐观锁、独立交叉验证、不同的信息来源、预算和取消。隔离上下文有利于权限控制，但移交包必须足够完整。\",\"更强的单体模型不会自动带来群体协调。群体要单独设计信息怎样流、能力怎样分、激励怎样约束、争议怎样裁决、错误怎样被发现。社会模拟和经济案例的细节不在本课已读范围内。\"],\"terms\":[{\"term\":\"同质趋同\",\"meaning\":\"相似的 Agent 使用相似证据，于是一起失败。\"},{\"term\":\"理解债\",\"meaning\":\"人不再能解释系统为何行动，却继续依赖它。\"},{\"term\":\"取消与预算\",\"meaning\":\"限制循环的时间和步数，避免无限扩张。\"}],\"example\":{\"title\":\"两个角色同时改同一文件\",\"body\":\"管理者让两个 Agent 修改同一个模块。没有工作副本时，后写的覆盖先写的。应让它们改不同分支或不同文件，再用测试合并。\"},\"exercise\":{\"title\":\"给协作补一条取消规则\",\"steps\":[\"用上一课的两个角色。\",\"写出共享的文件或状态是什么。\",\"写出怎样发现它们在重复同一错误。\",\"写出步数或时间到达后谁有权取消。\"],\"doneWhen\":\"失败时系统会停，而不是继续互相转发错误。\"},\"section\":\"多 Agent 协作的失败模式\"}],\"questions\":[{\"id\":\"q1\",\"prompt\":\"书中判断多 Agent 是否值得的第一标准是？\",\"choices\":[{\"id\":\"a\",\"text\":\"是否引入单个 Agent 生成时无法获得的新信息，并值得额外成本\"},{\"id\":\"b\",\"text\":\"角色数量是否不少于三个\"},{\"id\":\"c\",\"text\":\"是否使用了同一个系统提示词\"},{\"id\":\"d\",\"text\":\"是否让模型再读一遍自己的输出\"}],\"correctChoiceId\":\"a\",\"explanation\":\"没有新信息的讨论通常不提升上限。执行结果、视觉反馈和外部验证才改变这个判断。\"},{\"id\":\"q2\",\"prompt\":\"下列哪一种协作更可能带来新信息？\",\"choices\":[{\"id\":\"a\",\"text\":\"审核者查看测试失败或渲染截图\"},{\"id\":\"b\",\"text\":\"同一模型重新阅读自己的推理\"},{\"id\":\"c\",\"text\":\"多个模型只讨论文本本身，没有外部证据\"},{\"id\":\"d\",\"text\":\"把同一上下文复制十份\"}],\"correctChoiceId\":\"a\",\"explanation\":\"书中的对照表把执行反馈、视觉反馈和工具验证标成有信息增量。自我重读和纯文本辩论则没有。\"},{\"id\":\"q3\",\"prompt\":\"不共享上下文时，书中列出的常见传递方式是？\",\"choices\":[{\"id\":\"a\",\"text\":\"工具参数、共享文件、消息总线\"},{\"id\":\"b\",\"text\":\"只能共享全部隐藏推理\"},{\"id\":\"c\",\"text\":\"只能通过修改系统提示词的第一个字\"},{\"id\":\"d\",\"text\":\"把所有 Agent 的权重合并\"}],\"correctChoiceId\":\"a\",\"explanation\":\"文件对应共享内存，参数和总线对应消息传递。移交的是结构化信息，不是内心独白。\"},{\"id\":\"q4\",\"prompt\":\"三种协作拓扑是？\",\"choices\":[{\"id\":\"a\",\"text\":\"对等、管理者、去中心化\"},{\"id\":\"b\",\"text\":\"预训练、SFT、RL\"},{\"id\":\"c\",\"text\":\"稠密、稀疏、混合\"},{\"id\":\"d\",\"text\":\"级联、全双工、机器人\"}],\"correctChoiceId\":\"a\",\"explanation\":\"这是控制权和信息流的形状。上下文是否共享是另一个独立的轴。\"},{\"id\":\"q5\",\"prompt\":\"只给 Agent 更多步骤，为什么不一定更好？\",\"choices\":[{\"id\":\"a\",\"text\":\"没有预算意识时，它仍可能很早做浅层搜索并停住\"},{\"id\":\"b\",\"text\":\"步骤越多，Pass^k 一定线性上升\"},{\"id\":\"c\",\"text\":\"步骤预算只能用于语音\"},{\"id\":\"d\",\"text\":\"管理者不应该区分简单和复杂子任务\"}],\"correctChoiceId\":\"a\",\"explanation\":\"书中引用的研究表明，需要显式按剩余预算调整探索和利用。管理者应按难度分配步骤。\"},{\"id\":\"q6\",\"prompt\":\"多 Agent 放大错误时，小结强调人要警惕什么？\",\"choices\":[{\"id\":\"a\",\"text\":\"理解债和认知投降：不再理解产物，却把责任一并交出去\"},{\"id\":\"b\",\"text\":\"使用了过短的函数名\"},{\"id\":\"c\",\"text\":\"保留了可取消的预算\"},{\"id\":\"d\",\"text\":\"让审核者看测试结果\"}],\"correctChoiceId\":\"a\",\"explanation\":\"并发冲突、级联、同质失效和失控循环是系统问题。人仍要能理解并负责，而不是只收集最终答案。\"}]}}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"14:I[622,[],\"IconMark\"]\nc:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Agent 学习伴侣\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"配合李博杰《深入理解 AI Agent》的独立中文学习系统。进度保存在本机浏览器。\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/xiaofuzi-lab/ai-agent/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\"$\",\"link\",\"3\",{\"rel\":\"icon\",\"href\":\"/xiaofuzi-lab/ai-agent/icon.svg?8af7ff86a23bc488\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L14\",\"4\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"11:\"$c:metadata\"\n"])</script></body></html>
