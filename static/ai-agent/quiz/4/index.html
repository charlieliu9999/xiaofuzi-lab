apter4.md\",\"coverage\":\"依据第四章已读正文：五类工具、ACI、描述与参数保真、MCP 的三类原语、工具过多时的三层发现策略，以及感知、执行、协作的设计重点。事件触发和用户沟通的运行时细节留在第六章，本课不展开未读的异步实现。\",\"lessons\":[{\"id\":\"aci\",\"title\":\"按目标设计工具，而不是按接口端点\",\"minutes\":12,\"summary\":\"专用工具、通用执行器和 Skill 是形态选择。一次给模型看多少，是另一个独立选择。\",\"paragraphs\":[\"五类工具可以用调用方向来记。感知、执行、协作和用户沟通由 Agent 主动发起；事件触发是 Agent 事先注册、外部世界来叫醒它。感知拿信息，执行改变世界，协作驱动其他 Agent 或人。\",\"ACI 要求工具对应 Agent 的目标。一个部署动作可以是专用函数，也可以写成 Skill，由终端按步骤执行。专用工具约束强、占 token 多；Skill 目录便宜，正文用到再读。做成哪种形态，和一次展示多少条，是两件独立的事。\",\"描述要写清何时使用、做不到什么，并给参数一个具体例子。返回值结构也要写明。更隐蔽的失败是静默改写参数：模型看见的字符和工具真正用的字符不一致，它会无休止地重试。\"],\"terms\":[{\"term\":\"ACI\",\"meaning\":\"面向 Agent 的接口。目标要清楚，错误要难以发生。\"},{\"term\":\"专用工具\",\"meaning\":\"带结构约束的函数调用，定义本身消耗上下文。\"},{\"term\":\"参数保真\",\"meaning\":\"模型提交的参数不被框架偷偷改写或追加。\"}],\"example\":{\"title\":\"一条会让模型迷路的“好心转换”\",\"body\":\"书中举过编辑器把中文弯引号静默换成直引号的例子：读取时看见弯引号，替换时却已变成直引号，于是永远匹配不到。这个例子用来说明保真，不代表你当前安装的 Cursor 版本仍有同一行为。\"},\"exercise\":{\"title\":\"给一个工具写“何时用”和“不能做什么”\",\"steps\":[\"选一个你希望助手拥有的动作，例如搜索仓库或发送邮件。\",\"用两句写何时该用，用两句写明确不做的事。\",\"给一个参数写出具体例子，而不是只写格式名。\",\"写一条失败时的返回句，禁止只返回“error”。\"],\"doneWhen\":\"一个没见过这个工具的人能照着描述调用一次。\"},\"section\":\"工具的分类；工具设计的通用原则\"},{\"id\":\"mcp\",\"title\":\"MCP、目录和主动发现\",\"minutes\":13,\"summary\":\"MCP 让工具一次接入、多处使用。工具上百个时，不要把全部 schema 铺进前缀。\",\"paragraphs\":[\"MCP 是模型与外部工具、数据之间的开放协议。服务器暴露能力，客户端是 Agent 或编辑器。工具用 JSON Schema 描述参数；资源是可浏览的只读数据；提示模板是可复用的提示。本地常用标准输入输出，远程则书中写的是 Streamable HTTP，并指出早期 SSE 方案已经弃用。\",\"工具一多，选择会变差，前缀也会变重。书中把应对分成三层：只暴露索引、需要时再取定义；让模型声明自己缺什么能力，再动态注入；或者干脆用 Skill 目录，把发现变成查阅。是否采用 MCP，和会话开始时是否展示全部定义，仍然是两件事。\",\"感知工具要分页、要显式截断。静默截断会让 Agent 以为自己看完了。只读调用更容易缓存和并行，但缓存键仍要包含身份和授权，易变数据还要有过期时间。\"],\"terms\":[{\"term\":\"MCP\",\"meaning\":\"统一工具、资源和提示模板的客户端—服务器协议。\"},{\"term\":\"主动工具发现\",\"meaning\":\"模型用语言声明能力缺口，系统再匹配并注入。\"},{\"term\":\"显式截断\",\"meaning\":\"告诉模型省略了多少、怎样继续读，而不是悄悄截掉。\"}],\"example\":{\"title\":\"五个服务器也不该吃掉三分之一窗口\",\"body\":\"书中描述了一种实践：默认只给工具名索引，需要定义时再查。相关任务的 token 因此明显下降。你在 Cursor 里接入 MCP 时，可以用同一原则检查：启动后的前缀是索引，还是每一份完整 schema。\"},\"exercise\":{\"title\":\"列一份你会接入的工具目录\",\"steps\":[\"写下最多八个你希望编程助手使用的工具或 Skill 名称。\",\"每个只留一行描述，不写完整参数。\",\"标出哪三个是每次任务都需要的，其余标记为按需查阅。\",\"如果某个名字来自 MCP，再标出它是工具、资源还是提示模板。\"],\"doneWhen\":\"目录本身短到可以常驻，正文不在目录里。\"},\"section\":\"MCP 与 Skill Hub；工具太多怎么办\"},{\"id\":\"safety\",\"title\":\"执行要分层把关，协作要写清边界\",\"minutes\":12,\"summary\":\"改变世界的工具先校验、再限权，不可逆动作另请独立审核。子 Agent 只接收自包含任务。\",\"paragraphs\":[\"执行工具的失败可能删文件、打坏服务或产生费用。先做输入校验并快速失败，不要“聪明地”改掉可疑参数。权限再限制目录、命令和配额。黑名单挡不住变形命令，更稳的是理解命令意图，这一层第五章会接着讲。\",\"不可逆动作使用提议者—审核者：一个模型提议，另一个独立模型在执行前看参数，或在执行后核对结果。审核者看到的是动作和证据，不是提议者的自我辩解。\",\"子 Agent 的提示要写清角色、信息来源、任务边界和输出格式。来源标签能降低把用户内容和工具结果混成指令的风险。主上下文只收回结论，这和第二章的隔离是同一件事。\"],\"terms\":[{\"term\":\"事前审批\",\"meaning\":\"不可逆动作执行前，由独立角色批准。\"},{\"term\":\"事后验证\",\"meaning\":\"动作完成后对照预期状态检查。\"},{\"term\":\"子 Agent\",\"meaning\":\"承担自包含子任务，并把短结论交还。\"}],\"example\":{\"title\":\"删除文件不是低风险工具\",\"body\":\"同一把删除工具，删草稿和删迁移目录的风险完全不同。风险要看参数组合，不能只给工具贴一张永久的低风险标签。高风险组合停下来等人。\"},\"exercise\":{\"title\":\"给一个不可逆动作写双人规则\",\"steps\":[\"选一个你不允许助手擅自做的动作，例如推送到主分支或发外部邮件。\",\"写出提议里必须包含的参数。\",\"写出审核者只看哪些证据就够了。\",\"写出拒绝时返回给提议者的句子，让它能改，而不是原地重试。\"],\"doneWhen\":\"审核不依赖提议者的思考过程。\"},\"section\":\"执行工具；协作工具\"}],\"questions\":[{\"id\":\"q1\",\"prompt\":\"五类工具里，哪一类是外部事件来驱动 Agent，而不是 Agent 主动调用？\",\"choices\":[{\"id\":\"a\",\"text\":\"感知工具\"},{\"id\":\"b\",\"text\":\"执行工具\"},{\"id\":\"c\",\"text\":\"事件触发工具\"},{\"id\":\"d\",\"text\":\"协作工具\"}],\"correctChoiceId\":\"c\",\"explanation\":\"邮件、定时和 Webhook 由外部触发。Agent 事先注册，事件到达后才开始这一轮思考。\"},{\"id\":\"q2\",\"prompt\":\"ACI 相对于“把每个 API 端点包成一个工具”，强调什么？\",\"choices\":[{\"id\":\"a\",\"text\":\"工具应对应 Agent 要完成的目标，并让误用难以发生\"},{\"id\":\"b\",\"text\":\"工具越细越好，最好一个端点一个函数\"},{\"id\":\"c\",\"text\":\"不需要描述边界，模型会自己试出来\"},{\"id\":\"d\",\"text\":\"所有能力都必须做成 Skill，禁止函数调用\"}],\"correctChoiceId\":\"a\",\"explanation\":\"接口从程序员视角换成 Agent 视角。边界、例子和参数保真都是这个原则的展开。\"},{\"id\":\"q3\",\"prompt\":\"参数被框架静默改写之后，模型最典型的表现是？\",\"choices\":[{\"id\":\"a\",\"text\":\"它立刻知道框架改了什么，并一次改对\"},{\"id\":\"b\",\"text\":\"它按自己看见的内容反复尝试，却始终匹配失败\"},{\"id\":\"c\",\"text\":\"缓存命中率自动上升\"},{\"id\":\"d\",\"text\":\"工具定义从上下文中消失\"}],\"correctChoiceId\":\"b\",\"explanation\":\"模型感知的世界和工具操作的世界不一致。需要规范化时，必须在描述里写明。\"},{\"id\":\"q4\",\"prompt\":\"书中对 MCP 三类原语的划分是？\",\"choices\":[{\"id\":\"a\",\"text\":\"工具是可执行操作，资源是可读取数据，提示模板供选用\"},{\"id\":\"b\",\"text\":\"三者都是会改写生产数据库的执行工具\"},{\"id\":\"c\",\"text\":\"资源就是 Skill 正文，工具就是系统提示词\"},{\"id\":\"d\",\"text\":\"MCP 只规定模型权重的格式\"}],\"correctChoiceId\":\"a\",\"explanation\":\"把“做一件事”“读一份数据”和“套一个模板”分开，客户端才不会把读取误当成执行。\"},{\"id\":\"q5\",\"prompt\":\"工具数量上去之后，书中更推荐的默认披露是？\",\"choices\":[{\"id\":\"a\",\"text\":\"会话开始就把全部 schema 放进前缀\"},{\"id\":\"b\",\"text\":\"索引或目录常驻，定义和正文按需加载\"},{\"id\":\"c\",\"text\":\"关掉所有工具，只保留自然语言\"},{\"id\":\"d\",\"text\":\"每个工具都训练成一个新模型\"}],\"correctChoiceId\":\"b\",\"explanation\":\"全量注入既占 token，也会让选择变差，并在工具集变化时击穿缓存。\"},{\"id\":\"q6\",\"prompt\":\"读取大文件时，静默截断为什么危险？\",\"choices\":[{\"id\":\"a\",\"text\":\"它会自动把文件写回磁盘\"},{\"id\":\"b\",\"text\":\"模型会以为自己看到了全部，并基于残缺信息做决定\"},{\"id\":\"c\",\"text\":\"它只影响 KV Cache，不影响正确性\"},{\"id\":\"d\",\"text\":\"截断后的内容不能作为 tool 消息\"}],\"correctChoiceId\":\"b\",\"explanation\":\"应当说明显示了哪一段、一共有多长、用什么参数继续读。\"}]}}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"14:I[622,[],\"IconMark\"]\nc:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Agent 学习伴侣\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"配合李博杰《深入理解 AI Agent》的独立中文学习系统。进度保存在本机浏览器。\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/xiaofuzi-lab/ai-agent/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\"$\",\"link\",\"3\",{\"rel\":\"icon\",\"href\":\"/xiaofuzi-lab/ai-agent/icon.svg?8af7ff86a23bc488\",\"type\":\"image/svg+xml\",\"sizes\":\"any\"}],[\"$\",\"$L14\",\"4\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</s
